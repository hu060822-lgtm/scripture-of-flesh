name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  godot-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot 4.3
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.3-stable_linux.x86_64 godot
      - name: Import project (build class cache)
        run: ./godot --headless --path . --editor --quit || true
      - name: Run tests
        run: ./godot --headless --path . -s tests/run_tests.gd
